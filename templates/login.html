<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONVIF Camera Manager - Login</title>
    <link href="{{ url_for('static', filename='style/bootstrap.min.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style/fontawesome.min.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style/login.css')}}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="card">
                <div class="card-header text-center">
                    <div class="icon-container">
                        <i class="fas fa-video"></i>
                    </div>
                    <h4 class="mb-0">ONVIF Camera Manager</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="text-center mb-4">
                            <p class="text-muted">Enter your credentials</p>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                            <label for="username">Username</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Connect & Discover Cameras
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='scripts/bootstrap.bundle.min.js')}}"></script>
</body>
</html>
