<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONVIF Camera Manager</title>
    <link href="{{ url_for('static', filename='style/bootstrap.min.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style/fontawesome.min.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='style/cameras.css')}}" rel="stylesheet">
</head>
<body class="bg-light">
    {%  include 'partials/topbar.html' %}

    <!-- Error Toast -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="errorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-danger text-white">
                <i class="fas fa-exclamation-circle me-2"></i>
                <strong class="me-auto">Error</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="errorToastBody">
            </div>
        </div>
    </div>

    <div class="container py-4">
        {%  include 'partials/camera/list.html' %}
    </div>

    <!-- Connect Camera Modal -->
    <div class="modal fade" id="connectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Connect to Camera</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="connectForm">
                        <input type="hidden" id="cameraIndex">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" value="admin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" value="1234abcd">
                        </div>
                        <div class="alert alert-warning d-none" id="connectError">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="connectToCamera()" id="connectButton">
                        <span class="spinner-border spinner-border-sm d-none" id="connectSpinner"></span>
                        Connect
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='scripts/bootstrap.bundle.min.js')}}"></script>
    <script src="{{ url_for('static', filename='scripts/cameras.js')}}"></script>
</body>
</html>
